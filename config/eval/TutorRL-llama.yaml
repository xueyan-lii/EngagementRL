# Baseline: TutorRL-7B x Llama-3.1-8B (always-engaged, no disengagement
# dynamics), matched to full_baseline_2x2.sh CELL 2. Runs through eval.py
# (plain Classroom), NOT eval_engagement.py -- EvalConfig (eval.py's schema)
# has no engagement_model field at all, so this is a separate file from
# TutorRL.yaml rather than one shared config: merging a yaml with an
# engagement_model: block against EvalConfig raises ConfigKeyError.
teacher_model:
  model_name_or_path: eth-nlped/TutorRL-7B
  use_openrouter: false
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.85
    number_of_gpus_per_instance: 1
    gpu_ids: [0]
    use_v0: false
    enforce_eager: true
    load_and_unload: false

student_model:
  model_name_or_path: NousResearch/Meta-Llama-3.1-8B-Instruct
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.85
    number_of_gpus_per_instance: 1
    gpu_ids: [1]
    use_v0: false
    enforce_eager: true
    load_and_unload: false

judge_model:
  model_name_or_path: Qwen/Qwen3.6-27B
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.85
    number_of_gpus_per_instance: 1
    gpu_ids: [2]
    use_v0: false
    enforce_eager: true
    load_and_unload: false

reward_model:
  model_name_or_path: "Answer"

generation:
  forced_conversation_type: guided
  max_turns: 15
  number_student_attempts: 8

score_using_pedagogical_reward: false

logging:
  wandb: false
  wandb_project: eval
  wandb_run_name: TutorRL-7B-LlamaAlwaysEngaged
  run_group: tutor
  wandb_tags: ["tutor", "7b", "llama-always-engaged"]
