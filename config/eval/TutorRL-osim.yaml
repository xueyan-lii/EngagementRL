# Baseline: TutorRL-7B x OSIM (OdysSim student). The controlled pair to
# config/eval/TutorRL.yaml -- every model, prompt, dataset and metric is
# identical; the ONLY changed variable is the in-dialogue student simulator
# (microsoft/UserLM-8b -> cmu-lti/osim-8b).
#
# Note on the disengagement metric: OSIM has no end-of-conversation token, so
# disengagement is detected from an explicit textual sign-off. That proxy is
# conservative and UNCALIBRATED -- it is not comparable to UserLM's p_end, and
# a low rate here reflects the simulator, not the tutor.
teacher_model:
  model_name_or_path: eth-nlped/TutorRL-7B
  use_openrouter: false
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.85
    number_of_gpus_per_instance: 1
    gpu_ids: [0]
    use_v0: false
    enforce_eager: true
    load_and_unload: false

# Knowledge probe: unchanged from the UserLM baseline so Delta Solve Rate is
# measured on the same instrument across both arms.
student_model:
  model_name_or_path: NousResearch/Meta-Llama-3.1-8B-Instruct
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.85
    number_of_gpus_per_instance: 1
    gpu_ids: [2]
    use_v0: false
    enforce_eager: true
    load_and_unload: false

judge_model:
  model_name_or_path: Qwen/Qwen3.6-27B
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.85
    number_of_gpus_per_instance: 1
    gpu_ids: [3]
    use_v0: false
    enforce_eager: true
    load_and_unload: false

engagement_model:
  model_name_or_path: cmu-lti/osim-8b
  vllm:
    temperature: 1.0
    top_p: 0.8
    max_length: 8192
    max_num_seqs: 64
    gpu_memory_utilization: 0.85
    number_of_gpus_per_instance: 1
    gpu_ids: [5]
    use_v0: false
    enforce_eager: true
    load_and_unload: false

reward_model:
  model_name_or_path: "Answer"

simulator: osim
persona_path: prompt_templates/personas/osim_disengaged.txt

generation:
  forced_conversation_type: guided
  max_turns: 15
  number_student_attempts: 8

score_using_pedagogical_reward: false

logging:
  wandb: false
  wandb_project: eval
  wandb_run_name: TutorRL-7B-OSIM
  run_group: tutor
  wandb_tags: ["tutor", "7b", "osim"]
