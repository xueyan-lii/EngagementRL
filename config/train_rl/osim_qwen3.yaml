# Engagement-conditioned GRPO: Qwen3-8B tutor vs OdysSim student, on the
# OSIM-calibrated OpenR1 split, with the teacher holding the reference solution.
#
# What changed vs full_engagement.yaml (Qwen2.5-7B x UserLM x Big-Math) and why:
#
# TEACHER Qwen2.5-7B -> Qwen3-8B. The teacher gets no ground truth in the old
#   setup and must out-solve the student. Measured: OSIM solves Big-Math at
#   0.747 vs Qwen2.5-7B's 0.657 -- the student was the stronger mathematician.
#   Qwen3-8B is the same generation as OSIM's base; it roughly halves the
#   inverted band (student solves / teacher fails) from 11% to 5%.
#
# TEACHER PROMPT -> teacher_prompt_with_solution.txt. Even Qwen3-8B only clears
#   OSIM on ~7% of problems, so model choice alone does not fix the inversion.
#   Handing the tutor the worked solution removes its math ability as a
#   confound entirely and makes the gradient about pedagogy. The solution is
#   visible to the teacher only -- never to the student or either judge.
#
# DATASET Big-Math -> data/openr1_osim_incl0. Big-Math is calibrated to
#   Llama-3.1-8B; OSIM solves 75% of it and only 13.5% survives a difficulty
#   band. The OpenR1 build filters on worked-solution presence, solution length
#   <=500 tokens (so a few-turn dialogue can scaffold it) and OSIM solve rate
#   < 0.6. incl0 keeps rate-0 problems: with an LM-judged learning reward and a
#   solution-holding teacher, "the student cannot do this yet" is the target
#   population, not a floor. Swap to data/openr1_osim for the 0<rate variant.
#
# leak_multiplier 0.0 -> 1.0 (gate off) and engagement normalised by max turns:
#   see config/train_rl_engagement_model.py and judge_rewards.engagement_scalar.
#
# GPU layout assumes 0/1/2 free for the server and 3/4/5 for the trainer;
# re-pin per machine. Qwen3-8B is larger than the 7B this was tuned for, so
# watch the ref-model allocation at step 1.

simulator: osim
persona_path: prompt_templates/personas/osim_disengaged.txt

train:
  number_of_problems_per_batch: 6   # x8 samples = 48 dialogues/step (divisible by 3 ranks)
  num_samples_per_problem: 8        # GRPO group size
  per_device_train_batch_size: 1

  learning_rate: 5e-7
  beta: 0.001   # KL anchor; beta=0 collapsed v0 at ~step 95
  mu: 1
  max_steps: 200
  optimizer: adamw_torch
  gradient_checkpointing: true
  save_policy_to_disk_every_n: 1
  batch_size_ref_model: 1
  # Credit each teacher turn with the student turn it elicited, rather than
  # broadcasting one trajectory-level advantage across every token.
  per_turn_rewards: true
  per_turn_min_group: 4

teacher_model:
  model_name_or_path: Qwen/Qwen3-8B
  vllm:
    temperature: 1.0
    top_k: 50
    top_p: 1.0
    max_length: 8192
    max_num_seqs: 48
    gpu_memory_utilization: 0.38
    gpu_ids: [0]
    load_and_unload: false
    enable_sleep_mode: false
    use_v0: false
    enforce_eager: true
    # Qwen3-8B is a hybrid reasoning model and defaults to thinking ON. Combined
    # with the teacher prompt's own <think> instruction it produced ~120 tokens
    # of reasoning per 32 tokens of visible message, hit the 512-token cap on
    # 33% of turns, and left <think> unclosed on 24% -- leaking raw reasoning
    # (and the answer, 11% of turns) to the student and both judges.
    chat_template_kwargs: {enable_thinking: false}

engagement_model:
  model_name_or_path: cmu-lti/osim-8b
  vllm:
    temperature: 1.0
    top_p: 0.8
    max_length: 8192
    max_num_seqs: 24
    gpu_memory_utilization: 0.26
    gpu_ids: [1]
    load_and_unload: false
    enable_sleep_mode: false
    use_v0: false
    enforce_eager: true

judge_model:
  model_name_or_path: openai/gpt-oss-20b   # training judge unchanged
  vllm:
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    max_length: 16384
    max_num_seqs: 32
    gpu_memory_utilization: 0.50
    gpu_ids: [2]
    load_and_unload: false
    enable_sleep_mode: false
    use_v0: false
    enforce_eager: false

reward:
  engagement_weight: 0.5
  learning_weight: 1.0
  # 1.0 = leak gate OFF. The learning rubric's EVIDENCE RULE already penalises
  # tutor-stated answers per-dimension; the multiplicative gate on top fired on
  # ~70% of dialogues past one turn and was anti-correlated with engagement.
  # More load-bearing here than before, since the tutor now holds the solution.
  leak_multiplier: 1.0

dataset:
  max_train_examples: -1
  train_datasets:
    - name_or_path: data/openr1_osim_incl0
      split: train
      ratio: 1.0

generation:
  max_turns: 15                  # 15 total messages -> ~7 student turns
  max_tokens_per_turn: 512
  max_tokens_in_conversation: 4500  # caps logit memory so the ref model fits
  max_tokens_per_judge_attempt: 1500
  number_judge_attempts: 0
  use_thinking: false            # teacher prompt no longer instructs <think>;
                                 # see teacher chat_template_kwargs above
  forced_conversation_type: guided
  teacher_prompt_path: prompt_templates/teacher_prompt_with_solution.txt
  server_port: 8006
  use_experimental_shared_memory: false

logging:
  wandb: true
  wandb_project: engagement-rl
  wandb_run_name: qwen3-8b-osim-v4-perturn-learning
  run_group: osim
  wandb_tags: ["osim", "qwen3-8b", "refsol", "openr1"]
  save_dir: checkpoints/osim_qwen3_v4
  save_steps: 40
